<svg width="64" height="80" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert Scout, isometric 3/4 standing view, facing right. Ground line y=72. -->
  <ellipse cx="32" cy="72" rx="20" ry="8" fill="#000000" fill-opacity="0.25"/>
  <!-- legs -->
  <rect x="25" y="54" width="6" height="15" rx="2.5" fill="#8a7a4e"/>
  <rect x="33" y="54" width="6" height="15" rx="2.5" fill="#96854f"/>
  <!-- boots -->
  <rect x="23" y="67" width="9" height="6" rx="2" fill="#4a3d28"/>
  <rect x="32" y="67" width="9" height="6" rx="2" fill="#4a3d28"/>
  <!-- torso vest -->
  <rect x="19" y="32" width="26" height="26" rx="7" fill="#c8b280"/>
  <rect x="22" y="35" width="20" height="11" rx="4" fill="#d9c797"/>
  <!-- belt -->
  <rect x="19" y="52" width="26" height="5" rx="2" fill="#7a6a42"/>
  <!-- rifle held diagonally across chest, muzzle up-right -->
  <g transform="rotate(-32 32 42)">
    <rect x="29.5" y="16" width="5" height="42" rx="2" fill="#3b2f23"/>
    <rect x="28.5" y="40" width="7" height="9" rx="2" fill="#57432e"/>
  </g>
  <!-- arms / hands gripping rifle -->
  <circle cx="22" cy="47" r="4" fill="#c99a6e"/>
  <circle cx="42" cy="35" r="4" fill="#c99a6e"/>
  <!-- shoulder pads -->
  <rect x="15" y="32" width="9" height="11" rx="4" fill="#a08c5c"/>
  <rect x="40" y="32" width="9" height="11" rx="4" fill="#a08c5c"/>
  <!-- head: face 3/4 right, helmet -->
  <circle cx="33" cy="21" r="9" fill="#c99a6e"/>
  <path d="M 22.5 20 A 10.5 10.5 0 0 1 43.5 19 L 42 25 A 9 9 0 0 0 25 25.5 Z" fill="#7a7448"/>
  <circle cx="32" cy="14" r="8" fill="#8e8756"/>
  <!-- eye dot, facing right -->
  <circle cx="37.5" cy="23" r="1.4" fill="#3a2f20"/>
</svg>
