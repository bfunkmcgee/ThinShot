<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert Scout: 3/4 top-down khaki trooper with angled rifle -->
  <!-- ground shadow -->
  <ellipse cx="32" cy="38" rx="17" ry="13" fill="#000000" fill-opacity="0.22"/>
  <!-- rifle: angled dark barrel extending past right shoulder -->
  <g transform="rotate(-28 32 32)">
    <rect x="30" y="2" width="5" height="30" rx="1.5" fill="#3b2f23"/>
    <rect x="29" y="20" width="7" height="7" rx="1.5" fill="#57432e"/>
  </g>
  <!-- pack -->
  <rect x="20" y="38" width="24" height="12" rx="4" fill="#8a7a4e"/>
  <!-- shoulders / torso -->
  <rect x="15" y="24" width="34" height="22" rx="9" fill="#c8b280"/>
  <rect x="17" y="26" width="30" height="9" rx="4.5" fill="#d9c797"/>
  <!-- shoulder pads -->
  <rect x="13" y="27" width="9" height="13" rx="4" fill="#a08c5c"/>
  <rect x="42" y="27" width="9" height="13" rx="4" fill="#a08c5c"/>
  <!-- hands -->
  <circle cx="45" cy="24" r="3.4" fill="#c99a6e"/>
  <circle cx="36" cy="17" r="3.4" fill="#c99a6e"/>
  <!-- helmet, offset up-left for 3/4 view -->
  <circle cx="31" cy="27" r="11.5" fill="#7a7448"/>
  <circle cx="31" cy="27" r="8.5" fill="#8e8756"/>
  <path d="M 23.5 22 A 9.5 9.5 0 0 1 38 21" fill="none" stroke="#a29b66" stroke-width="2.6" stroke-linecap="round"/>
  <!-- helmet chin strap hint -->
  <rect x="29" y="36" width="4" height="4" rx="2" fill="#5c5636"/>
</svg>
